<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5c63"/>
      <stop offset="18%" stop-color="#3a3b41"/>
      <stop offset="55%" stop-color="#232429"/>
      <stop offset="100%" stop-color="#131417"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2d32"/>
      <stop offset="100%" stop-color="#101113"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0b400" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffc93f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0b400" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="45%" stop-color="#e0b400" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111214" stop-opacity="1"/>
      <stop offset="30%" stop-color="#111214" stop-opacity="0.78"/>
      <stop offset="58%" stop-color="#111214" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#111214" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111214" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#111214" stop-opacity="0"/>
      <stop offset="100%" stop-color="#111214" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur30" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- fine engineering grid, restrained -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="820" y1="60" x2="820" y2="740"/>
    <line x1="980" y1="60" x2="980" y2="740"/>
  </g>

  <!-- blueprint dimension annotation, subtle -->
  <g stroke="#ffc93f" stroke-opacity="0.22" stroke-width="1.4">
    <line x1="700" y1="640" x2="1140" y2="640"/>
    <line x1="700" y1="630" x2="700" y2="650"/>
    <line x1="1140" y1="630" x2="1140" y2="650"/>
  </g>
  <circle cx="700" cy="640" r="3" fill="#ffc93f" fill-opacity="0.4"/>
  <circle cx="1140" cy="640" r="3" fill="#ffc93f" fill-opacity="0.4"/>

  <!-- soft directional spotlight -->
  <ellipse cx="840" cy="330" rx="420" ry="360" fill="url(#spot)" filter="url(#blur30)"/>

  <g filter="url(#shadow)">
    <!-- ================= HAMMER DRILL / PERFORATOR — hero object ================= -->
    <g transform="translate(760,330) rotate(-9)">

      <!-- side auxiliary handle -->
      <rect x="150" y="18" width="15" height="86" rx="7.5" fill="url(#metalDark)" transform="rotate(10 157 18)"/>
      <circle cx="180" cy="112" r="12" fill="url(#metalDark)" transform="rotate(10 157 18)"/>

      <!-- rear D-handle -->
      <path d="M -150 -10 C -150 -58, -108 -92, -62 -92 L -30 -92 L -30 -68 L -60 -68 C -96 -68, -126 -42, -126 -8 C -126 26, -98 54, -62 54 L -30 54 L -30 78 L -62 78 C -112 78, -150 40, -150 -10 Z"
            fill="url(#metalDark)"/>
      <rect x="-116" y="-20" width="18" height="32" rx="7" fill="#dba52a"/>

      <!-- main body -->
      <path d="M -40 -66 C -40 -84, -24 -98, 0 -98 L 150 -98 C 172 -98, 188 -80, 188 -58 L 188 58 C 188 80, 172 98, 150 98 L 0 98 C -24 98, -40 84, -40 66 Z"
            fill="url(#metal)"/>

      <!-- vent lines (functional detail = pro credibility) -->
      <g stroke="#0d0e10" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
        <line x1="8" y1="-70" x2="8" y2="-52"/>
        <line x1="22" y1="-74" x2="22" y2="-52"/>
        <line x1="36" y1="-76" x2="36" y2="-52"/>
        <line x1="50" y1="-76" x2="50" y2="-52"/>
        <line x1="64" y1="-74" x2="64" y2="-52"/>
      </g>

      <!-- mode collar -->
      <circle cx="140" cy="0" r="30" fill="url(#metalDark)"/>
      <circle cx="140" cy="0" r="30" fill="none" stroke="#dba52a" stroke-width="2" stroke-opacity="0.55"/>
      <line x1="140" y1="-22" x2="140" y2="-10" stroke="#dba52a" stroke-width="2.5" stroke-opacity="0.8"/>

      <!-- barrel -->
      <rect x="185" y="-24" width="130" height="48" rx="12" fill="url(#metal)"/>
      <rect x="185" y="-24" width="130" height="10" rx="5" fill="#ffffff" opacity="0.05"/>

      <!-- SDS chuck -->
      <rect x="308" y="-16" width="46" height="32" rx="5" fill="url(#metalDark)"/>
      <rect x="350" y="-11" width="34" height="22" rx="4" fill="#101113"/>
      <line x1="356" y1="-11" x2="356" y2="11" stroke="#dba52a" stroke-width="2" stroke-opacity="0.7"/>
      <line x1="366" y1="-11" x2="366" y2="11" stroke="#dba52a" stroke-width="2" stroke-opacity="0.7"/>
      <line x1="376" y1="-11" x2="376" y2="11" stroke="#dba52a" stroke-width="2" stroke-opacity="0.7"/>

      <!-- trigger -->
      <rect x="-96" y="-6" width="22" height="34" rx="8" fill="#101113"/>
      <rect x="-92" y="-2" width="14" height="26" rx="6" fill="#dba52a" opacity="0.85"/>

      <!-- brand-mark strip (implies quality/certification without a logo) -->
      <rect x="10" y="34" width="90" height="6" rx="3" fill="#0d0e10" opacity="0.5"/>
      <rect x="10" y="34" width="46" height="6" rx="3" fill="#dba52a" opacity="0.6"/>

      <!-- top rim light -->
      <path d="M -30 -80 C -10 -96, 140 -96, 172 -80" stroke="url(#rim)" stroke-width="3" opacity="0.6" fill="none"/>
      <path d="M 190 -20 L 312 -14" stroke="url(#rim)" stroke-width="2" opacity="0.5"/>
    </g>
  </g>

  <!-- crosshair micro-mark, technical accent -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <circle cx="1090" cy="150" r="16"/>
    <line x1="1090" y1="128" x2="1090" y2="140"/>
    <line x1="1090" y1="160" x2="1090" y2="172"/>
    <line x1="1068" y1="150" x2="1080" y2="150"/>
    <line x1="1100" y1="150" x2="1112" y2="150"/>
  </g>

  <rect x="0" y="0" width="1200" height="800" fill="url(#fade)"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#vfade)"/>
</svg>
